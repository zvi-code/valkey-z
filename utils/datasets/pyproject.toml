[tool.poetry]
name = "search_delete_test"
version = "0.1.0"
description = "Memory stress testing tool for Valkey-Search with vector operations"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [
    {include = "core", from = "src"},
    {include = "cli", from = "src"},
    {include = "datasets", from = "src"},
    {include = "monitoring", from = "src"},
    {include = "scenarios", from = "src"},
    {include = "visualization", from = "src"},
    {include = "workload", from = "src"}
]

[tool.poetry.dependencies]
python = "^3.9"
numpy = "^1.24.0"
valkey = "^6.0.0"
psutil = "^5.9.0"
prometheus-client = "^0.19.0"
typer = ">=0.9.0"
pyyaml = "^6.0"
h5py = "^3.10.0"
aiofiles = "^23.0"
pandas = "^2.0.0"
rich = "^13.0.0"
# Visualization dependencies (optional)
matplotlib = {version = "^3.7.0", optional = true}
plotly = {version = "^5.17.0", optional = true}
seaborn = {version = "^0.12.0", optional = true}
kaleido = {version = "^0.2.1", optional = true}

[tool.poetry.extras]
visualization = ["matplotlib", "plotly", "seaborn", "kaleido"]
all = ["matplotlib", "plotly", "seaborn", "kaleido"]

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
black = "^23.0.0"
ruff = "^0.1.0"
mypy = "^1.7.0"

[tool.poetry.scripts]
vst = "cli.main:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py39']

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]
target-version = "py39"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
